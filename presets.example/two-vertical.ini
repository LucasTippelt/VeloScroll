# VeloScroll use-case preset 'two-vertical' — two vertical velocity scrolls on one mouse (docs/PRESETS.md, "Two vertical modes"):
# SCROLL_BTN at a slow-to-medium pace (the Cruising case), SCROLL_BTN_H with VERTICAL_H = true at a medium-to-fast pace (the Fast case).
[veloscroll]
MAX_RATE = 90.0
MIN_RATE = 3.0
CURVE = 1.2
OUT_SMOOTH = 0.65
MAX_RATE_H = 220.0
MIN_RATE_H = 90.0
CURVE_H = 0.35
OUT_SMOOTH_H = 0.9
VERTICAL_H = true
